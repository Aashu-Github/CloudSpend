[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudspend"
version = "0.1.0"
description = "Local-first AWS FinOps visualizer and optimizer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CloudSpend Contributors"}]
dependencies = [
  "Flask>=3.0,<4",
  "boto3>=1.34,<2",
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "gunicorn>=22,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "moto[ec2]>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
cloudspend = "cloudspend.cli:main"

[tool.setuptools.packages.find]
include = ["cloudspend*"]

[tool.setuptools.package-data]
"cloudspend.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
