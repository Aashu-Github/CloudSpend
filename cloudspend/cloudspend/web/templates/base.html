<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}CloudSpend{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <nav id="nav">
    <a class="nav-logo" href="{{ url_for('web.home') }}" aria-label="CloudSpend home">
      <span class="logo-main">CloudSpend</span><span class="logo-mark"></span>
    </a>
    <button class="mobile-menu-btn" type="button" aria-expanded="false" aria-controls="navLinks">MENU</button>
    <div class="nav-links" id="navLinks">
      <a class="nav-link {% if request.endpoint == 'web.home' %}active{% endif %}" href="{{ url_for('web.home') }}">Home</a>
      <a class="nav-link {% if request.endpoint == 'web.import_page' %}active{% endif %}" href="{{ url_for('web.import_page') }}">Import</a>
      <a class="nav-link {% if request.endpoint == 'web.aws_page' %}active{% endif %}" href="{{ url_for('web.aws_page') }}">Live AWS</a>
      <a class="nav-link {% if request.endpoint == 'web.methodology' %}active{% endif %}" href="{{ url_for('web.methodology') }}">Methodology</a>
      <a class="nav-link {% if request.endpoint == 'web.stack' %}active{% endif %}" href="{{ url_for('web.stack') }}">Stack</a>
      <a class="nav-github" href="https://github.com/Aashu-Github/cloudspend" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="footer-brand">Cloud<span>Spend.</span></div>
    <div class="footer-right"><span>Local-first AWS FinOps</span><a class="footer-link" href="{{ url_for('web.methodology') }}">Read-only by design</a></div>
  </footer>

  <div id="app-modal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <button class="modal-close" type="button" aria-label="Close" data-modal-close>×</button>
      <span class="section-label" id="modal-kicker">CLOUDSPEND</span>
      <h2 id="modal-title">Something went wrong.</h2>
      <p id="modal-message"></p>
      <button class="btn btn-primary modal-action" type="button" data-modal-close>Close</button>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
